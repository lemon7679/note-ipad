name: Release

# Builds the unsigned IPA (Release, arm64, iPadOS 17+) against note-core and
# publishes a GitHub Release with it.
#
#  - Run manually (Actions → Release → Run workflow): enter the version; the tag
#    v<version> is created on the commit the workflow runs on.
#  - Or push a `v*` tag.
#
# Release notes come from docs/releases/v<version>.md; build details are appended.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without "v" (e.g. 0.1.0)
        required: true
      core_ref:
        description: note-core branch, tag or commit to build with
        default: main
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lemon7679/note-core
          ref: ${{ inputs.core_ref || 'main' }}
          path: note-core
      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version from $GITHUB_SHA"
      - name: Build IPA
        run: |
          mv note-core ../note-core
          xcodebuild -version
          ci/build-ipa.sh "${{ steps.v.outputs.version }}" dist
          (cd dist && shasum -a 256 NoteApp-*.ipa > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release notes
        run: |
          notes="docs/releases/${{ steps.v.outputs.tag }}.md"
          if [ -f "$notes" ]; then cp "$notes" dist/NOTES.md; else echo "Note ${{ steps.v.outputs.tag }}" > dist/NOTES.md; fi
          {
            echo
            echo "### 빌드 정보"
            echo
            echo "- note-ipad \`$(git rev-parse --short HEAD)\` · note-core \`$(git -C ../note-core rev-parse --short HEAD)\`"
            echo "- $(xcodebuild -version | head -1) · iOS SDK $(xcrun --sdk iphoneos --show-sdk-version) · arm64 · iPadOS 17.0+"
            echo "- SHA-256 \`$(cut -d' ' -f1 dist/SHA256SUMS.txt)\`"
          } >> dist/NOTES.md
          cat dist/NOTES.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Note ${{ steps.v.outputs.tag }}
          body_path: dist/NOTES.md
          files: |
            dist/NoteApp-*.ipa
            dist/SHA256SUMS.txt
