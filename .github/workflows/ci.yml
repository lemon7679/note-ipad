name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notekit-linux:
    name: NoteKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    env:
      NOTE_ENGINE_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Bridge stub matches the engine bridge
        run: scripts/check-bridge-api.sh
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  ios-app:
    name: iOS app (${{ matrix.engine }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [stub, note-core]
    env:
      # Add a repository secret NOTE_CORE_TOKEN (read access to lemon7679/note-core)
      # to build against the real engine; without it that matrix leg is skipped.
      NOTE_CORE_TOKEN: ${{ secrets.NOTE_CORE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out note-core
        if: matrix.engine == 'note-core' && env.NOTE_CORE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: lemon7679/note-core
          token: ${{ secrets.NOTE_CORE_TOKEN }}
          path: note-core
      - name: Build for iOS Simulator
        if: matrix.engine == 'stub' || env.NOTE_CORE_TOKEN != ''
        run: |
          xcodebuild -version
          if [ "${{ matrix.engine }}" = "stub" ]; then
            touch .engine-stub   # xcodebuild does not pass env vars to Package.swift
          else
            mv note-core ../note-core   # Package.swift looks for ../note-core
          fi
          xcodebuild -list
          set -o pipefail
          xcodebuild build \
            -scheme NoteiPad \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || true
          grep -E "error:|warning:" build.log | sed -E "s#^.*/note-ipad/##" | sort -u | head -200 || true
          echo "Compiled app sources: $(grep -oE 'Sources/NoteApp/[A-Za-z/]+\.swift' build.log | sort -u | wc -l)"
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ matrix.engine }}
          path: build.log
          if-no-files-found: ignore

  simulator:
    name: iPad Simulator run (stub engine)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, install, launch and screenshot
        run: ci/simulator-screenshots.sh
