name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notekit-linux:
    name: NoteKit tests (Linux, real engine)
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lemon7679/note-core
          path: note-core
      - name: Place note-core next to note-ipad
        run: mv note-core ../note-core
      - name: Bridge stub matches the engine bridge
        run: scripts/check-bridge-api.sh
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  ios-app:
    name: iOS app (${{ matrix.engine }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [stub, note-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.engine == 'note-core'
        with:
          repository: lemon7679/note-core
          path: note-core
      - name: Build for iOS Simulator
        run: |
          xcodebuild -version
          if [ "${{ matrix.engine }}" = "stub" ]; then
            touch .engine-stub   # xcodebuild does not pass env vars to Package.swift
          else
            mv note-core ../note-core   # Package.swift looks for ../note-core
          fi
          xcodebuild -list
          xcodebuild build \
            -scheme NoteiPad \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || true
          grep -E "error:|warning:" build.log | sed -E "s#^.*/note-ipad/##" | sort -u | head -200 || true
          echo "Compiled app sources: $(grep -oE 'Sources/NoteApp/[A-Za-z/]+\.swift' build.log | sort -u | wc -l)"
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ matrix.engine }}
          path: build.log
          if-no-files-found: ignore

  simulator:
    name: iPad Simulator run (real engine)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lemon7679/note-core
          path: note-core
      - name: Build, install, launch and screenshot
        run: |
          mv note-core ../note-core
          NOTE_ENGINE=core ci/simulator-screenshots.sh
